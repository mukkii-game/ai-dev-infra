name: Merge Guard

# Reusable policy for enabling native auto-merge on pull requests from this
# repository. The caller must be triggered by pull_request_target, grant only
# the two permissions below, and must never check out pull-request code.
on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    name: Guard and enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check caller event
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != 'pull_request_target' ]; then
            echo "::error::Merge Guard must be called from pull_request_target, got ${EVENT_NAME}."
            exit 1
          fi
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The caller did not provide a valid pull request event."
            exit 1
          fi
          case "${EVENT_ACTION}" in
            opened|synchronize|reopened|ready_for_review) ;;
            *)
              echo "::error::Unexpected pull_request_target action: ${EVENT_ACTION}."
              exit 1
              ;;
          esac

      # No checkout: untrusted PR code never reaches this write-capable runner.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          if [ "${HEAD_REPO:-}" != "${REPO}" ]; then
            echo "::error::Head repository is not ${REPO}; auto-merge is only enabled for branches in this repository."
            exit 1
          fi

          # Every in-repository pull request auto-merges once CI passes,
          # .github/** included. Requiring a human for workflow changes was a
          # safety valve that cost more in manual merges than it protected in
          # a one-person, agent-driven repository.
          gh pr merge --auto --squash --repo "${REPO}" "${PR_NUMBER}"
